# JobRadar AI - Orquestador local de n8n
# Uso:
#   docker compose up -d      (levantar)
#   docker compose logs -f    (ver logs)
#   docker compose down       (detener; los datos persisten en el volumen)
#
# El editor queda en: http://localhost:5678
# Las variables de ${...} se cargan desde el archivo .env (ver .env.example)

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: jobradar-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Zona horaria para los Schedule Triggers (cron a las 09:00)
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Argentina/Buenos_Aires}
      - TZ=${TIMEZONE:-America/Argentina/Buenos_Aires}
      # Credenciales del dueño de la instancia (primer login)
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_BASIC_AUTH_ACTIVE=false
      # Datos sensibles (API keys) se guardan encriptados en el volumen
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Opcionales: más logs si algo falla
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
      # Carpeta para exportar/importar workflows e info del proyecto
      - ./workflow:/home/node/.n8n/workflows:ro

volumes:
  n8n_data:
